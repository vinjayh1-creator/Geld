<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Planner">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f8fa">
<meta name="theme-color" content="#0f172a">
<title>Budget Planner</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest"></script>

























































</head>
<body>
<div class="app">
<aside>
<div class="brand brand-with-user"><i data-lucide="wallet"></i><div><div>Budget Planner</div><div class="brand-user">Yaniv</div></div></div>
<nav>
<button data-view="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</button>
<button data-view="transactions"><i data-lucide="arrow-left-right"></i>Transacties</button>
<button data-view="accounts"><i data-lucide="landmark"></i>Rekeningen</button>
<button data-view="crypto"><i data-lucide="bitcoin"></i>Crypto/Pokemon</button>

<button data-view="dealplug"><i data-lucide="shopping-bag"></i>DealPlugNL</button>
<button data-view="goals"><i data-lucide="target"></i>Spaardoelen</button>
<button data-view="recurring"><i data-lucide="repeat"></i>Terugkerend</button>
</nav>
<div class="bottom-tools">
  <div style="display:grid;gap:8px;margin-bottom:10px">
    <button class="theme-btn" id="backupDownload"><i data-lucide="download"></i><span>Backup downloaden</span></button>
    <button class="theme-btn" id="backupRestore"><i data-lucide="upload"></i><span>Backup herstellen</span></button>
    <input type="file" id="backupFile" accept=".json,application/json" style="display:none">
  </div>
  <button class="theme-btn" id="themeBtn"><i data-lucide="moon"></i><span>Licht/donker</span></button><button class="amount-visibility-toggle" id="toggleAmountsVisibility" title="Bedragen verbergen" aria-label="Bedragen verbergen"><i data-lucide="eye-off"></i></button>
</div>
</aside>
<main>
<div class="mobile-head">
  <div class="brand"><i data-lucide="wallet"></i>Budget Planner</div>
  <div style="display:flex;gap:7px;align-items:center">
    <button class="icon-btn" id="mobileBackup" title="Backup"><i data-lucide="hard-drive-download"></i></button>
    <button class="icon-btn amount-visibility-toggle" id="mobileToggleAmounts" title="Bedragen verbergen" aria-label="Bedragen verbergen"><i data-lucide="eye-off"></i></button><button class="icon-btn" id="mobileTheme"><i data-lucide="moon"></i></button>
  </div>
</div>
<div id="mobileBackupMenu" style="display:none;position:fixed;top:62px;right:14px;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:var(--shadow);min-width:190px">
  <button class="quick-btn" id="mobileBackupDownload" style="width:100%;min-height:auto;display:flex;flex-direction:row;align-items:center;gap:9px;padding:11px;text-align:left">
    <i data-lucide="download"></i><strong>Backup downloaden</strong>
  </button>
  <button class="quick-btn" id="mobileBackupRestore" style="width:100%;min-height:auto;display:flex;flex-direction:row;align-items:center;gap:9px;padding:11px;text-align:left;margin-top:5px">
    <i data-lucide="upload"></i><strong>Backup herstellen</strong>
  </button>
</div>
<div class="site-controls">
<div class="small">Alles wordt automatisch lokaal in deze browser opgeslagen.</div>


</div>
<section id="dashboard" class="view"></section>
<section id="transactions" class="view"></section>
<section id="accounts" class="view"></section>
<section id="crypto" class="view"></section>

<section id="dealplug" class="view"></section>
<section id="goals" class="view"></section>
<section id="recurring" class="view"></section>
</main>
</div>
<div class="bottom-nav">
<button data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Home</span></button>
<button data-view="transactions"><i data-lucide="arrow-left-right"></i><span>Transacties</span></button>
<button data-view="accounts"><i data-lucide="landmark"></i><span>Rekeningen</span></button>
<button data-view="crypto"><i data-lucide="bitcoin"></i><span>Crypto/Pokemon</span></button>
<button data-view="dealplug"><i data-lucide="shopping-bag"></i><span>DealPlugNL</span></button>
<button data-view="goals"><i data-lucide="target"></i><span>Doelen</span></button>
<button data-view="recurring"><i data-lucide="repeat"></i><span>Vast</span></button>
</div>

<script src="app.js" defer></script>










</body>
</html>
